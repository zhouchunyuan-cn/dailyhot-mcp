[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dailyhot-mcp"
version = "0.1.1"
description = "中文热榜聚合 MCP server —— 库 / CLI / MCP 三层接入，源可用性每日实测透明可见"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zhouchunyuan" }]
keywords = ["mcp", "hot-news", "trending", "chinese", "llm", "agent", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
# 核心零依赖（纯标准库 urllib）；MCP server 走可选依赖
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.20,<2"]  # mcp 2.x 改名 FastMCP→MCPServer，v2 适配进行中
dev = ["pytest>=7.0", "ruff>=0.4", "mcp>=1.20,<2"]

[project.scripts]
dailyhot = "dailyhot.cli:main"
dailyhot-mcp = "dailyhot.mcp_server:main"

[project.urls]
Homepage = "https://github.com/zhouchunyuan-cn/dailyhot-mcp"
Issues = "https://github.com/zhouchunyuan-cn/dailyhot-mcp/issues"
Changelog = "https://github.com/zhouchunyuan-cn/dailyhot-mcp/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["dailyhot"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
